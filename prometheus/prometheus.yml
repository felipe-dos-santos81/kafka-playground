# Prometheus for the playground: scrapes every topic-owner container, found
# through the Docker socket by its topic-owner.role label (no target list), and
# evaluates the alert rules in rules.yml.
global:
  scrape_interval: 5s
  scrape_timeout: 4s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/rules.yml]

scrape_configs:
  - job_name: topic-owners
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        port: 9000
        filters: [{name: label, values: [topic-owner.role]}]
    relabel_configs:
      # instance is the container name (= the topic), not its IP
      - source_labels: [__meta_docker_container_name]
        regex: '/(.*)'
        target_label: instance
      # oneoff="true" marks a `docker compose run` one-off (verify-topics'), whose
      # absence TopicOwnerUnhealthy ignores; services get no oneoff label
      - source_labels: [__meta_docker_container_label_com_docker_compose_oneoff]
        regex: 'True'
        target_label: oneoff
        replacement: 'true'
