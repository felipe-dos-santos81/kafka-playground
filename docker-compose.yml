# Local Kafka playground: one KRaft broker, one-shot topic jobs, kcat consumers,
# a small producer page, Redpanda Console, Pipeline Studio, topic owners and
# Prometheus. No auth, no TLS, nothing persisted.
# Containers reach the broker at kafka:19092; the host at localhost:9092.

# One-shot job: create a topic, exit 0 (also when it already exists).
# Declare it as many times as you need topics; only `environment` changes.
x-topic: &topic
  image: apache/kafka:4.3.1
  depends_on: &after-kafka
    kafka:
      condition: service_healthy
  command:
    - bash
    - -ec
    - |
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
        --create --if-not-exists \
        --topic "$${TOPIC_NAME:?TOPIC_NAME is required}" \
        --partitions "$${PARTITIONS:-1}" \
        --replication-factor "$${REPLICATION_FACTOR:-1}"

# Consumer: subscribe to one topic, print every record to stdout.
# GROUP_ID defaults to the container hostname, so a consumer without one is
# its own group (fan-out); consumers sharing a GROUP_ID split the partitions.
x-consumer: &consumer
  image: confluentinc/cp-kcat:8.2.4
  depends_on: *after-kafka
  entrypoint:
    - sh
    - -ec
    - |
      exec kcat -b kafka:19092 \
        -G "$${GROUP_ID:-$$HOSTNAME}" \
        -X auto.offset.reset="$${AUTO_OFFSET_RESET:-earliest}" \
        -u -f 'partition=%p offset=%o key=%k value=%s\n' \
        "$${TOPIC_NAME:?TOPIC_NAME is required}"

# Topic owner: one long-running container per topic (topic-owner/, Go).
# ROLE=main owns <base>-<instance>; retry owns <base>-<instance>__retry; dlq
# owns <base>-<instance>__dlq. Each creates its topic, keeps it in the desired
# state (every 10 s) and serves /healthz and /metrics on :9000 inside the
# network. Declare one block of three per instance, after `producer` (they use
# its *bootstrap anchor); container name = service name = topic name.
x-topic-owner: &topic-owner
  build: ./topic-owner
  image: kafka-playground/topic-owner:0.1.0
  pull_policy: build
  depends_on: *after-kafka
  healthcheck:
    test: ["CMD", "/topic-owner", "-healthcheck"]
    interval: 2s
    retries: 30

services:
  kafka:
    image: apache/kafka:4.3.1
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  topic-orders:
    <<: *topic
    environment:
      TOPIC_NAME: orders
      PARTITIONS: 3

  topic-events:
    <<: *topic
    environment:
      TOPIC_NAME: events

  # Two members of one group on a 3-partition topic: each gets a share.
  # `docker compose up -d --scale orders-workers=3` adds a member.
  orders-workers:
    <<: *consumer
    depends_on: &orders-deps
      <<: *after-kafka
      topic-orders:
        condition: service_completed_successfully
    deploy:
      replicas: 2
    environment:
      TOPIC_NAME: orders
      GROUP_ID: orders-workers

  # Own group (no GROUP_ID): receives every record regardless of the workers.
  orders-audit:
    <<: *consumer
    depends_on: *orders-deps
    environment:
      TOPIC_NAME: orders

  # Producer page: topic dropdown, key, JSON value validated before sending,
  # shows partition and offset. Source in ./producer. Waits for every topic
  # job so the dropdown is complete (and `docker compose up --wait` accepts
  # the exited jobs as finished dependencies).
  producer:
    build: ./producer
    image: kafka-playground/producer:1.0.0
    pull_policy: build    # local image: never pull this name from a registry; rebuild on every up (cached)
    depends_on:
      <<: *after-kafka
      topic-orders:
        condition: service_completed_successfully
      topic-events:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      KAFKA_BROKERS: &bootstrap kafka:19092
    healthcheck:
      test: ["CMD", "/producer", "-healthcheck"]
      interval: 2s
      retries: 30

  # Pipeline Studio: canvas editor for flows (http://localhost:8082). Flows are
  # files in ./flows. The Docker socket lets the studio run nodes as containers
  # from M2 on; /api/health proves it can reach the engine.
  studio:
    build: ./studio
    image: kafka-playground/studio:0.1.0
    pull_policy: build
    depends_on: *after-kafka
    ports:
      - "127.0.0.1:8082:8082"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./flows:/data
    environment:
      KAFKA_BROKERS: *bootstrap
    healthcheck:
      test: ["CMD", "/studio", "-healthcheck"]
      interval: 2s
      retries: 30

  # Kafka web UI for browsing topics, messages and groups: http://localhost:8080
  console:
    image: redpandadata/console:v3.12.0
    depends_on: *after-kafka
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      KAFKA_BROKERS: *bootstrap
      ANALYTICS_ENABLED: "false"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/admin/health"]
      interval: 2s
      retries: 30

  # Topic owners for orders-1, its retry topic and its DLQ (README, "Topic owners").
  orders-1:
    <<: *topic-owner
    container_name: orders-1
    labels: &orders-1-labels
      topic-owner.base: orders
      topic-owner.instance: "1"
      topic-owner.role: main
    environment: &orders-1-env
      KAFKA_BROKERS: *bootstrap
      BASE_NAME: orders
      INSTANCE: 1
      ROLE: main
      PARTITIONS: 3

  # Produces to orders-1 and orders-1__dlq (from M2 on), so it starts after both.
  orders-1__retry:
    <<: *topic-owner
    container_name: orders-1__retry
    depends_on:
      <<: *after-kafka
      orders-1: {condition: service_healthy}
      orders-1__dlq: {condition: service_healthy}
    labels: {<<: *orders-1-labels, topic-owner.role: retry}
    environment: {<<: *orders-1-env, ROLE: retry, MAX_ATTEMPTS: 3}

  orders-1__dlq:
    <<: *topic-owner
    container_name: orders-1__dlq
    labels: {<<: *orders-1-labels, topic-owner.role: dlq}
    environment: {<<: *orders-1-env, ROLE: dlq}

  # Prometheus: scrapes every topic owner, found by its labels through the
  # Docker socket (no target list): http://localhost:9090
  prometheus:
    image: prom/prometheus:v3.15.0
    group_add: ["0"]    # Docker Desktop shows the socket as root:root 0660 inside containers
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./prometheus:/etc/prometheus:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 2s
      retries: 30
